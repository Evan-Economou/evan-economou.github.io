# Builds the site with Hugo and publishes it to GitHub Pages on every push
# to the main branch.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that's in progress.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The Hugo version used to build the site. Leave empty ("") to always
      # use the newest release.
      HUGO_VERSION: "0.169.0"
    steps:
      - name: Install Hugo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=""
          if [ -n "$HUGO_VERSION" ]; then tag="v$HUGO_VERSION"; fi
          gh release download $tag --repo gohugoio/hugo \
            --pattern 'hugo_extended_[0-9]*_linux-amd64.deb' --output "$RUNNER_TEMP/hugo.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
          hugo version

      - name: Check out the site
        uses: actions/checkout@v5

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      # Packaged by hand instead of with actions/upload-pages-artifact, because
      # that action drops hidden files like /.well-known/tdmrep.json.
      - name: Package site
        run: tar --dereference --hard-dereference --directory public -cvf "$RUNNER_TEMP/artifact.tar" .

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
